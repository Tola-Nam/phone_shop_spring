databaseChangeLog:
  - changeSet:
      id: 001_init_database_schema
      author: tola.dev001@gmail.com
      changes:
        - createTable:
            tableName: brands
            columns:
              - column:
                  name: brand_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: brand_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

